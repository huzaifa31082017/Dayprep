<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>DayPrep | Eat out from Mira Road to Virar</title>
<link href="https://fonts.googleapis.com/css2?family=Young Serif:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bgimg:#F5EFE3;--bg:#F5EFE3;--card:#FBF7EE;--ink:#2A1A1D;--mute:#6F5E5B;--line:#D8CBB6;--primary:#6E1E2B;--accent:#DDE5D0;--grad:#6E1E2B;--sea:#2F5233;--sea-soft:#E3E9D8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{color-scheme:only light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bgimg) fixed;color:var(--ink);font:400 16px/1.55 Karla,system-ui,sans-serif}
h1,h2,h3{font-family:Young Serif,Georgia,serif;line-height:1.15;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:700 22px Young Serif,Georgia,serif;text-decoration:none;color:var(--ink)}
.lg{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--grad);color:#fff;font-size:18px}
.logo i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:600}
nav a.on,nav a:hover{background:var(--sea-soft);color:var(--sea)}
main{max-width:1100px;margin:auto;padding:28px 20px 60px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(42,26,29,.2)}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field span{font-size:14px;color:var(--mute);font-weight:600}
input,select,textarea{padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);width:100%}
.hero{min-height:calc(100svh - 110px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.pill{background:var(--card);border-radius:99px;padding:8px 18px;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.hero h1{font-size:clamp(36px,7vw,68px);font-weight:800;max-width:15ch;margin:18px auto 12px}
.g{-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:48ch;font-size:18px;margin:0 0 24px}
.search{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:20px;text-align:left}
.hero .search{max-width:820px;width:100%;margin-top:0;box-shadow:0 18px 40px rgba(42,26,29,.14)}
.full{flex-basis:100%;padding:14px}
h2{font-size:28px;margin:36px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:600}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.step{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;margin-bottom:10px}
.step h3{font-size:18px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.place{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:110px;display:grid;place-items:center;font:800 44px Young Serif,Georgia,serif;color:rgba(255,255,255,.9)}
.pb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:18px}
.meta{color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mute)}
.stop{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stop input[type=time]{padding:6px 8px}
.travel{margin:6px 0 6px 20px;padding-left:14px;border-left:3px dashed var(--sea);color:var(--sea);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.stop{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.empty{padding:28px;border:2px dashed var(--line);border-radius:14px;color:var(--mute);text-align:center}
dialog{border:0;border-radius:18px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(216,232,208,.72);backdrop-filter:blur(3px)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px 18px;border-radius:10px;display:none;z-index:9}
a.btn{display:inline-block;text-decoration:none}
.top{background:var(--grad);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
dialog.auth{width:min(900px,calc(100% - 32px));max-width:none;height:auto;max-height:calc(100dvh - 32px);margin:auto;border-radius:24px;overflow:auto;background:linear-gradient(135deg,#F5EFE3,#E3E9D8);box-shadow:0 30px 80px rgba(42,26,29,.25)}
.authg{display:grid;grid-template-columns:1fr 1fr}
.brand{position:relative;overflow:hidden;background:linear-gradient(145deg,#2F5233 0%,#6E1E2B 55%,#9bbd9d 100%);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.bl{display:flex;align-items:center;gap:12px;font:700 26px Young Serif,Georgia,serif}
.bl .lg{background:rgba(255,255,255,.25);width:52px;height:52px;font-size:24px;border-radius:14px;color:#fff}
.brand h2{margin:8px 0 0;font:700 clamp(32px,4vw,44px)/1.1 Young Serif,Georgia,serif}
.brand .sub{margin:0;font-size:19px;opacity:.92;max-width:30ch}
.stats{display:flex;gap:24px;margin-top:12px}
.stats div{display:flex;flex-direction:column;padding-right:24px;border-right:1px solid rgba(255,255,255,.35)}
.stats div:last-child{border:0}
.stats b{font:700 24px Young Serif,Georgia,serif}.stats span{font-size:14px;opacity:.85}
.fl1,.fl2,.fl3{position:absolute;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.2)}
.fl1{top:48px;right:12%;width:84px;height:84px}.fl2{top:48%;right:6%}.fl3{bottom:24%;left:10%}
.authr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:16px}
.acard{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(42,26,29,.12);display:flex;flex-direction:column;gap:14px;color:#2A1A1D}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f4f6;border-radius:14px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:#6F5E5B;cursor:pointer}
.tabs button.on{background:#fff;color:#2F5233;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ic{position:relative}.ic svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#6E1E2B;fill:none;stroke-width:2}.ic input{padding-left:42px}
.fl{font-size:12px;font-weight:700;letter-spacing:.05em;color:#6F5E5B;text-transform:uppercase;display:block;margin-bottom:6px}
.lnk{background:none;border:0;color:#2F5233;font-weight:600;cursor:pointer;padding:0}
@media(max-width:820px){.authg{grid-template-columns:1fr}.brand{padding:24px;gap:8px}.brand .sub,.stats,.fl1,.fl2,.fl3{display:none}.brand h2{font-size:32px;margin:0}.bl{font-size:24px}.bl .lg{width:44px;height:44px;font-size:20px}}
footer{background:#2A1A1D;color:#E8DCC8;margin-top:40px;padding:48px 20px 24px}
.fgrid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
footer h4{color:#fff;font:700 15px Young Serif,Georgia,serif;letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px}
footer a,footer .fb{display:block;color:#E8DCC8;text-decoration:none;padding:5px 0;background:none;border:0;cursor:pointer;text-align:left;font:inherit}
footer a:hover,footer .fb:hover{color:#fff}
.soc{display:flex;gap:10px}.soc button{width:50px;height:50px;border-radius:12px;border:0;background:#6B2A36;display:grid;place-items:center;cursor:pointer}
.soc svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fcopy{max-width:1100px;margin:32px auto 0;padding-top:20px;border-top:1px solid #6B2A36;text-align:center;font-size:14px;color:#B9A58F}
.nav-card{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);font-size:20px}.nav-card:hover{border-color:var(--sea)}
@media(max-width:640px){.bar{gap:8px 10px}nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav a{white-space:nowrap;padding:8px 10px}#who{margin-left:auto}#who .meta{display:none}main{padding:20px 16px 48px}.hero h1{font-size:clamp(32px,10vw,44px)}}
.hero{position:relative}
.hero>:not(.dec){position:relative;z-index:1}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r) + 4deg))}}
.fl1{--r:-10deg;animation:drift 6s ease-in-out infinite}
.fl2{--r:8deg;animation:drift 7s ease-in-out -2s infinite}
.fl3{--r:-6deg;animation:drift 6.5s ease-in-out -4s infinite}
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
dialog.auth[open]{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fl1,.fl2,.fl3,.brand,dialog.auth[open]{animation:none}}
.cq{max-width:860px;padding:14px 16px}
.cq h3{font-size:17px;margin-bottom:10px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.cq .field{min-width:0}.cq .field span{font-size:13px}
.cq input,.cq select{padding:7px 10px;font-size:15px}
.cq .chip{padding:5px 12px;font-size:14px}
@media(max-width:560px){.qgrid{grid-template-columns:1fr 1fr}}
.hrow{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.hcard{flex:0 0 280px;scroll-snap-align:start;display:flex;flex-direction:column}
.hcard .btn{align-self:flex-start;margin-top:auto}
.hcard.wide{flex:1 1 100%}
.hcard.wide .stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 20px}
.hcard .stops{display:flex;flex-direction:column;gap:8px}
.hcard.wide .stops{gap:10px 14px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--sea-soft);border:1px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s}
.sbox .st{background:var(--grad);color:#fff;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sbox span:last-child{min-width:0}
.rvc{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:8;width:min(400px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(42,26,29,.2);animation:pop .35s ease-out}
.rst{display:flex;justify-content:center;gap:6px}
.rst button{background:none;border:0;font-size:30px;line-height:1;color:#f59e0b;cursor:pointer;padding:2px 4px}
@media(max-width:560px){.rvc{right:12px;left:12px;width:auto}}
@media(prefers-reduced-motion:reduce){.rvc{animation:none}}
#toast.ok{background:#2F5233;color:#fff;border-color:#243F28}
#toast.bad{background:#dc2626;color:#fff;border-color:#b91c1c}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes slidein{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes draw{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pgin{from{opacity:0}to{opacity:1}}
@keyframes heart{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes tick{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}
@keyframes chipin{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:translateY(-50%) rotate(0)}25%{transform:translateY(-50%) rotate(-14deg)}75%{transform:translateY(-50%) rotate(14deg)}}
.field input:focus,.field select:focus{outline:2px solid var(--sea);outline-offset:1px}
.ic2{position:relative}
.ic2 svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round}
.ic2 svg.wig{animation:wig .5s}
.sgd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--bg);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.12);padding:8px;max-height:280px;overflow:auto;text-align:left;display:none}
.sgd.open{display:block;animation:rise .2s backwards}
.sgh{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:8px 10px 4px}
.sgi{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--ink);font:inherit}
.sgi:hover,.sgi.act{background:var(--accent)}
.ph{position:relative;overflow:hidden}
.ph span{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.hrt{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#e11d48;font-size:18px;cursor:pointer;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.place:hover .hrt,.hrt:focus-visible{opacity:1;transform:scale(1)}
.hrt.pop{opacity:1;transform:scale(1);animation:heart .45s}
@media(hover:none){.hrt{opacity:1;transform:none}}
.stop.in{animation:slidein .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*90ms)}
.stop.in input[type=time]{animation:fadein .6s .25s backwards}
.travel.in{animation:draw .5s backwards;animation-delay:calc(var(--i,0)*90ms)}
.stop.out{height:0!important;padding-top:0;padding-bottom:0;margin:0;opacity:0;transform:translateX(24px);transition:height .26s,padding .26s,opacity .22s,transform .26s}
#toast{animation:tpop .3s}
.tk{display:inline-block;animation:tick .45s .1s backwards}
.chip{transition:background .25s,transform .2s,box-shadow .25s}
.chip.on{animation:chipin .3s}
.btn{transition:transform .15s,filter .2s,box-shadow .2s}
.btn:active,.chip:active{transform:scale(.95)}
#app.pg{animation:pgin .22s ease-out}
.rv:not(.rv-in){opacity:0;transform:translateY(26px) scale(.98)}
.rv{transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}.rv:not(.rv-in){opacity:1;transform:none}}
.hscroll{display:flex;gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:14px 6px 30px;margin:-10px -6px 0;scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>.place{flex:0 0 270px;scroll-snap-align:start}
.hscroll.drag{scroll-snap-type:none;scroll-behavior:auto;cursor:grabbing;user-select:none}
.hscroll.auto{scroll-snap-type:none;scroll-behavior:auto}
.seeall{align-items:center;justify-content:center;gap:10px;min-height:260px;text-align:center;text-decoration:none;color:var(--ink)}
.seeall .ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent);box-shadow:none;font-size:24px;transition:transform .25s}
.seeall:hover .ic{transform:translateX(6px)}
@media(max-width:560px){.hscroll>.place{flex-basis:78%}}
@media(prefers-reduced-motion:reduce){.hscroll{scroll-behavior:auto}}

/* theme */
:root{--r:2px}
body{font:400 16px/1.6 Karla,system-ui,sans-serif}
h1,h2,h3,h4,.logo,.step b,.ph,.stats b,.bl,.brand h2{font-weight:400}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg svg{position:absolute;left:0;top:0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.2;will-change:transform}
main,footer{position:relative;z-index:1}
header{background:var(--bg);border-bottom:3px double var(--primary)}
.lg{display:none}
.logo{font:400 27px Young Serif,Georgia,serif;letter-spacing:-.01em}
.logo i{font-style:italic;background:none;-webkit-text-fill-color:currentColor;color:var(--primary)}
nav a{border-radius:0;padding:6px 10px;font-weight:500;font-size:15px}
nav a.on,nav a:hover{background:none;color:var(--primary);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.btn{border-radius:var(--r);box-shadow:none;background:var(--primary);color:#FBF7EE;letter-spacing:.01em}
.btn:hover{background:var(--sea)}
.btn.alt{background:none;color:var(--primary);border:1px solid var(--primary)}
.btn.alt:hover{background:var(--primary);color:#FBF7EE}
input,select,textarea{background:#FFFDF8;border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.hero{min-height:auto;align-items:flex-start;justify-content:flex-start;text-align:left;padding:56px 0 32px}
.kick{font:700 12px Karla,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
.hero h1{font-size:clamp(38px,5.6vw,66px);line-height:1.08;max-width:18ch;margin:14px 0;letter-spacing:-.015em}
.hero h1 em{color:var(--primary)}
.hero p{max-width:50ch;margin:0 0 30px}
.search,.hero .search{background:var(--card);border:1px solid var(--primary);border-radius:var(--r);box-shadow:none}
#app>h2{border-top:3px double var(--primary);padding-top:14px}
.panel,.stop,.acard,.rvc,.hcard,.sbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.place{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.ph{height:52px;margin:0;border-radius:0;place-items:center start;padding:0 14px;font:italic 400 28px Young Serif,Georgia,serif}
.pb h3{font-size:19px}
.chip{border:1px solid var(--primary);background:none;color:var(--primary);border-radius:var(--r);box-shadow:none}
.chip.on{background:var(--sea);border-color:var(--sea);color:#FBF7EE}
.step{background:none;border:0;border-top:2px solid var(--sea);border-radius:0;padding:14px 4px 0}
.step b{display:block;width:auto;height:auto;background:none;color:var(--primary);border-radius:0;font:italic 400 30px Young Serif,Georgia,serif;margin:0 0 4px}
.top,.sbox .st{background:var(--accent);color:var(--sea);border-radius:var(--r)}
.tabs{background:none;border-bottom:1px solid var(--line);border-radius:0;padding:0}
.tabs button,.tabs button.on{border-radius:0;background:none;box-shadow:none}
.tabs button.on{color:var(--primary);border-bottom:2px solid var(--primary)}

const SEL='h2,.panel,.place,.step,.stop,.travel,.search,.chip,.empty,.note,.nav-card,.cols>div>.row',units=[],map=new Map();
app.querySelectorAll(SEL).forEach(el=>{if(el.closest('.hero,.hrow,.hscroll')||el.classList.contains('in')||(el.parentElement&&el.parentElement.closest(SEL)))return;units.push({o:el,els:[el]})});
app.querySelectorAll('.hrow,.hscroll').forEach(sc=>{const k=[...sc.children].filter(c=>c.matches('.place,.hcard,.panel'));if(k.length)units.push({o:sc,els:k})});
units.forEach(u=>{u.els.forEach(e=>e.classList.add('rv'));map.set(u.o,u)});
const pos=(a,b)=>{const x=a.o.getBoundingClientRect(),y=b.o.getBoundingClientRect();return Math.abs(x.top-y.top)>12?x.top-y.top:x.left-y.left};
rio=new IntersectionObserver(es=>{const hit=[];es.forEach(e=>{if(e.isIntersecting){rio.unobserve(e.target);const u=map.get(e.target);if(u)hit.push(u)}});
if(!hit.length)return;const seq=[];hit.sort(pos).forEach(u=>seq.push(...u.els));
const step=seq.length>9?Math.round(720/seq.length):85;
seq.forEach((el,i)=>{const d=i*step;el.style.transitionDelay=d+'ms';el.classList.add('rv-in');setTimeout(()=>{el.classList.remove('rv','rv-in');el.style.transitionDelay=''},d+850)})},{threshold:.1,rootMargin:'0px 0px -30px 0px'});
units.forEach(u=>rio.observe(u.o))}
